<text x="55" y="115" fill="#203647" font-size="38" font-weight="700" text-anchor="start">Compresión: observa una secuencia</text>
<text x="55" y="153" fill="#617b8d" font-size="22" font-weight="400" text-anchor="start">La maniobra tiene tiempo; una sola captura muestra solo un momento.</text>

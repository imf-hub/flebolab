<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Compresión: observa una secuencia</title><desc id="desc">La maniobra tiene tiempo; una sola captura muestra solo un momento.. Esquema educativo original de FLEBO LAB; no representa una adquisición clínica.</desc>

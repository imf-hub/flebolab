<text x="55" y="115" fill="#203647" font-size="38" font-weight="700" text-anchor="start">Conservar volumen</text>
<text x="55" y="153" fill="#617b8d" font-size="22" font-weight="400" text-anchor="start">El cambio de volumen corresponde al balance del circuito.</text>

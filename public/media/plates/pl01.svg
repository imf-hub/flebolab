<text x="55" y="115" fill="#203647" font-size="38" font-weight="700" text-anchor="start">El retorno necesita una referencia</text>
<text x="55" y="153" fill="#617b8d" font-size="22" font-weight="400" text-anchor="start">Presión, altura y conexiones forman un sistema.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Postura y carga gravitacional</title><desc id="desc">El potencial se interpreta con la altura y su referencia.. Esquema educativo original de FLEBO LAB; no representa una adquisición clínica.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif}.static{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.static{display:inline}}</style>
<rect width="1200" height="800" fill="#fff"/><rect width="1200" height="9" fill="#b7213c"/>
<text x="55" y="60" fill="#7a91a4" font-size="18" font-weight="700" text-anchor="start">FLEBO LAB IMF · PL03</text>
<text x="55" y="115" fill="#203647" font-size="38" font-weight="700" text-anchor="start">Postura y carga gravitacional</text>
<text x="55" y="153" fill="#617b8d" font-size="22" font-weight="400" text-anchor="start">El potencial se interpreta con la altura y su referencia.</text>
<rect x="260" y="255" width="80" height="350" rx="40.0" fill="#dcecf7" stroke="#2c769a" /><line x1="300.0" y1="267" x2="300.0" y2="593" stroke="#a7c8dc" stroke-width="2" /><line x1="210" y1="255" x2="210" y2="605" stroke="#7a91a4" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="175" y="435" fill="#203647" font-size="28" font-weight="400" text-anchor="end">Δh</text><text x="380" y="285" fill="#203647" font-size="23" font-weight="400" text-anchor="start">Nivel superior</text><text x="380" y="600" fill="#203647" font-size="23" font-weight="400" text-anchor="start">Nivel inferior</text><rect x="660" y="310" width="440" height="116" rx="16" fill="#edf3f7" stroke="none" /><text x="684" y="346" fill="#a8203c" font-size="23" font-weight="700" text-anchor="start">Una sola convención</text><text x="684" y="377" fill="#203647" font-size="19" font-weight="400" text-anchor="start">No contar dos veces la contribución</text><text x="684" y="401" fill="#203647" font-size="19" font-weight="400" text-anchor="start">gravitacional en la presión.</text><rect x="660" y="465" width="440" height="116" rx="16" fill="#edf3f7" stroke="none" /><text x="684" y="501" fill="#a8203c" font-size="23" font-weight="700" text-anchor="start">Comparación controlada</text><text x="684" y="532" fill="#203647" font-size="19" font-weight="400" text-anchor="start">Conserva el resto de parámetros al</text><text x="684" y="556" fill="#203647" font-size="19" font-weight="400" text-anchor="start">cambiar la postura.</text>

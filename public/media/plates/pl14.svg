<text x="55" y="60" fill="#7a91a4" font-size="18" font-weight="700" text-anchor="start">FLEBO LAB IMF · PL14</text>
<text x="55" y="115" fill="#203647" font-size="38" font-weight="700" text-anchor="start">La señal depende de una proyección</text>
<text x="55" y="153" fill="#617b8d" font-size="22" font-weight="400" text-anchor="start">El ángulo comparte vértice con haz y movimiento.</text>
<line x1="240" y1="500" x2="610" y2="500" stroke="#2c769a" stroke-width="8" marker-end="url(#arrow)"/><line x1="240" y1="500" x2="520" y2="280" stroke="#c42946" stroke-width="7" marker-end="url(#arrow)"/><path d="M340,500 A100,100 0 0 0 319,438" fill="none" stroke="#7a91a4" stroke-width="3" stroke-linecap="round" /><text x="350" y="471" fill="#203647" font-size="32" font-weight="400" text-anchor="start">θ</text><text x="610" y="550" fill="#203647" font-size="25" font-weight="400" text-anchor="middle">Movimiento</text><text x="440" y="240" fill="#203647" font-size="25" font-weight="400" text-anchor="start">Dirección del haz</text><rect x="700" y="340" width="400" height="116" rx="16" fill="#edf3f7" stroke="none" /><text x="724" y="376" fill="#a8203c" font-size="23" font-weight="700" text-anchor="start">fD ∝ v · cos θ</text><text x="724" y="407" fill="#203647" font-size="19" font-weight="400" text-anchor="start">θ es el ángulo entre las dos</text><text x="724" y="431" fill="#203647" font-size="19" font-weight="400" text-anchor="start">direcciones. Proyección, no</text><text x="724" y="455" fill="#203647" font-size="19" font-weight="400" text-anchor="start">velocidad corregida.</text>
<line x1="55" y1="723" x2="1145" y2="723" stroke="#dce5eb" stroke-width="2" />

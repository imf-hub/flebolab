<text x="55" y="115" fill="#203647" font-size="38" font-weight="700" text-anchor="start">La señal depende de una proyección</text>
<text x="55" y="153" fill="#617b8d" font-size="22" font-weight="400" text-anchor="start">El término coseno relaciona haz y dirección del movimiento.</text>
